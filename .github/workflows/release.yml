name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: zinc-linux-x86_64
            bin: zinc
          - os: macos-latest
            asset: zinc-macos-arm64
            bin: zinc
          - os: windows-latest
            asset: zinc-windows-x86_64.exe
            bin: zinc.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup LLVM
        uses: ./.github/actions/setup-llvm

      - name: Build zinc (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: make clean && make

      - name: Build zinc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Run tests (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash run_tests.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash run_tests.sh

      # Rename the built binary to its per-OS asset name before handing it to
      # the release job. Done after the tests so ./zinc still has its default
      # name while run_tests.sh runs.
      - name: Package binary (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # MinGW's linker appends .exe to an extensionless -o name, so the
        # Makefile's `-o zinc` yields zinc.exe; fall back to zinc just in case.
        run: |
          if [ -f "${{ matrix.bin }}" ]; then
            cp "${{ matrix.bin }}" "${{ matrix.asset }}"
          else
            cp zinc "${{ matrix.asset }}"
          fi

      # Hand the binary to the release job via an artifact. This is an
      # intra-workflow handoff only - the durable copy is the release asset.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected binaries
        run: ls -lR dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
