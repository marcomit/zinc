name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang liblld-dev
          if ! command -v llvm-config &>/dev/null; then
            VERSIONED=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)
            if [ -n "$VERSIONED" ]; then
              sudo ln -sf "$VERSIONED" /usr/local/bin/llvm-config
            else
              echo "::error::llvm-config not found after installing llvm-dev"
              exit 1
            fi
          fi
          echo "llvm-config: $(llvm-config --version)"
          echo "clang:       $(clang --version | head -1)"

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "llvm-config: $(llvm-config --version)"
          echo "clang:       $(clang --version | head -1)"
          echo "lld prefix:  $(brew --prefix lld)"

      # The choco LLVM package ships the compiler only - no headers, no llvm-config.
      # MSYS2's mingw-w64-x86_64-llvm is a full dev distribution that includes all of
      # those, and is the standard approach for LLVM development on Windows CI.
      - name: Install LLVM via MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-clang
            make

      - name: Export LLVM flags (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # llvm-config may return multi-line output; collapse to one line so
          # GITHUB_ENV's key=value parser doesn't choke on bare "-lLLVM-XX" lines.
          echo "LLVM_CFLAGS=$(llvm-config --cflags | tr '\n' ' ')"          >> "$GITHUB_ENV"
          echo "LLVM_LDFLAGS=$(llvm-config --ldflags --libs all --system-libs | tr '\n' ' ')" >> "$GITHUB_ENV"
          echo "llvm-config: $(llvm-config --version)"
          echo "clang:       $(clang --version | head -1)"

      - name: Build zinc (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: make clean && make

      - name: Build zinc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make clean && make

      - name: Run tests (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash run_tests.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash run_tests.sh

  # Build the compiler under sanitizers and run the whole test suite through
  # it, so memory errors / UB in zinc's own code surface as a failing job.
  # Windows is excluded: sanitizers aren't wired up for the MSYS2 build.
  sanitizers:
    name: sanitize-${{ matrix.san }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        san: [asan, ubsan]
    runs-on: ${{ matrix.os }}

    env:
      # Turn sanitizer findings into a non-zero exit so CI actually fails.
      # detect_leaks=0:           zinc allocates arena-style and exits without
      #                           freeing, so every run would "leak" by design.
      # detect_container_overflow=0: we link a non-instrumented libLLVM that
      #                           shares STL containers across the ASan
      #                           boundary - the classic ASan false positive.
      ASAN_OPTIONS: abort_on_error=1:detect_leaks=0:detect_container_overflow=0
      # UBSan only prints by default; halt_on_error makes a finding fail.
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev clang liblld-dev
          if ! command -v llvm-config &>/dev/null; then
            VERSIONED=$(ls /usr/bin/llvm-config-* 2>/dev/null | sort -V | tail -1)
            if [ -n "$VERSIONED" ]; then
              sudo ln -sf "$VERSIONED" /usr/local/bin/llvm-config
            else
              echo "::error::llvm-config not found after installing llvm-dev"
              exit 1
            fi
          fi
          echo "clang: $(clang --version | head -1)"

      - name: Install LLVM and Clang (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build zinc (${{ matrix.san }})
        shell: bash
        run: make clean && make ${{ matrix.san }}

      - name: Run tests under ${{ matrix.san }}
        shell: bash
        run: ZINC=./zinc-${{ matrix.san }} bash run_tests.sh
