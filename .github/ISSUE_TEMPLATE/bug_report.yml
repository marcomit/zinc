name: Bug Report
description: Report a bug or unexpected behavior in the Zinc compiler
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal Reproducer
      description: The smallest Zinc snippet that triggers the bug.
      render: shell
      placeholder: |
        i32 main() {
            // ...
        }
    validations:
      required: true

  - type: textarea
    id: compiler_output
    attributes:
      label: Compiler Output
      description: Paste the full output of `./zinc yourfile.zn` (error, crash trace, wrong IR, etc.)
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the compiler have done instead?
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Compiler Stage
      description: Which phase seems to be failing?
      options:
        - Lexer
        - Parser
        - Semantic analysis
        - Code generation (zgen.c)
        - Macro expansion
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low - wrong output, cosmetic
        - Medium - broken feature, workaround exists
        - High - broken feature, no workaround
        - Critical - compiler crash / segfault
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Environment
      description: OS, LLVM version, commit hash (`git rev-parse --short HEAD`).
      placeholder: "OS: macOS 15 / LLVM 18 / commit: abc1234"
    validations:
      required: false
